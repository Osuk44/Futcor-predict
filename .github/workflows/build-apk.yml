name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Te permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build APK
        run: |
          # Compilamos el APK para Android (Ajusta el icono si no tienes uno)
          fyne package -os android -app-id com.futcor.predictor -icon /usr/share/icons/hicolor/512x512/apps/fyne.png

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutcorPredict-APK
          path: "*.apk"
